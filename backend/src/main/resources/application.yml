spring:
  application:
    name: qisi-ai-backend
  datasource:
    url: jdbc:h2:mem:qisi;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
